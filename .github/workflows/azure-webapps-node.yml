# This workflow will build and push a node.js application to an Azure Web App when a commit is pushed to your default branch.
#
# This workflow assumes you have already created the target Azure App Service web app.
# For instructions see https://docs.microsoft.com/en-us/azure/app-service/quickstart-nodejs?tabs=linux&pivots=development-environment-cli
#
# To configure this workflow:
#
# 1. Download the Publish Profile for your Azure Web App. You can download this file from the Overview page of your Web App in the Azure Portal.
#    For more information: https://docs.microsoft.com/en-us/azure/app-service/deploy-github-actions?tabs=applevel#generate-deployment-credentials
#
# 2. Create a secret in your repository named AZURE_WEBAPP_PUBLISH_PROFILE, paste the publish profile contents as the value of the secret.
#    For instructions on obtaining the publish profile see: https://docs.microsoft.com/azure/app-service/deploy-github-actions#configure-the-github-secret
#
# 3. Change the value for the AZURE_WEBAPP_NAME. Optionally, change the AZURE_WEBAPP_PACKAGE_PATH and NODE_VERSION environment variables below.
#
# For more information on GitHub Actions for Azure: https://github.com/Azure/Actions
# For more information on the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# For more samples to get started with GitHub Action workflows to deploy to Azure: https://github.com/Azure/actions-workflow-samples

name: workflow

on:
  push:
    branches:
      - main

env:
  # Language and Runtime Configuration
  APP_LANGUAGE: ${{ vars.APP_LANGUAGE || 'python' }}  # 'python' or 'nodejs'
  PYTHON_VERSION: ${{ vars.PYTHON_VERSION || '3.10' }}
  NODE_VERSION: ${{ vars.NODE_VERSION || '18' }}
  
  # Application Configuration
  APP_ENTRY_FILE: ${{ vars.APP_ENTRY_FILE || 'app.py' }}
  HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL || 'http://localhost:3000' }}
  
  # Testing Configuration
  COVERAGE_THRESHOLD: ${{ vars.COVERAGE_THRESHOLD || '80' }}
  TEST_PATTERN: ${{ vars.TEST_PATTERN || 'test_*.py' }}
  TEST_COMMAND: ${{ vars.TEST_COMMAND || 'npm test' }}
  
  # Docker Configuration
  DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME || 'myapp' }}
  DOCKER_IMAGE_TAG: ${{ vars.DOCKER_IMAGE_TAG || 'latest' }}
  DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY || 'docker.io' }}

permissions:
  id-token: write
  contents: read
  security-events: write
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Python Setup
      - name: Set up Python
        if: ${{ env.APP_LANGUAGE == 'python' }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Node.js Setup
      - name: Set up Node.js
        if: ${{ env.APP_LANGUAGE == 'nodejs' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Install Dependencies - Python
      - name: Install Python Dependencies
        if: ${{ env.APP_LANGUAGE == 'python' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      # Install Dependencies - Node.js
      - name: Install Node.js Dependencies
        if: ${{ env.APP_LANGUAGE == 'nodejs' }}
        run: npm ci

      - name: Generate SBOM for source
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom-source.spdx.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-source
          path: sbom-source.spdx.json

      # Run Tests - Python
      - name: Run Python Unit Tests with Coverage
        if: ${{ env.APP_LANGUAGE == 'python' }}
        run: |
          coverage run -m unittest ${{ env.APP_ENTRY_FILE }}
          coverage report -m --fail-under=${{ env.COVERAGE_THRESHOLD }}

      - name: Run Python Integration Tests with Coverage
        if: ${{ env.APP_LANGUAGE == 'python' }}
        run: |
          coverage run -a -m unittest discover -s . -p "${{ env.TEST_PATTERN }}" -v
          coverage report -m --fail-under=${{ env.COVERAGE_THRESHOLD }}
          coverage html
          coverage xml

      # Run Tests - Node.js
      - name: Run Node.js Tests
        if: ${{ env.APP_LANGUAGE == 'nodejs' }}
        run: ${{ env.TEST_COMMAND }}

      - name: Upload Coverage Report
        if: ${{ env.APP_LANGUAGE == 'python' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

      # Deploy - Python
      - name: Deploy Python Application
        if: ${{ env.APP_LANGUAGE == 'python' }}
        run: |
          nohup python3 ${{ env.APP_ENTRY_FILE }} &

      # Deploy - Node.js
      - name: Deploy Node.js Application
        if: ${{ env.APP_LANGUAGE == 'nodejs' }}
        run: |
          nohup npm start &

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Log in to Docker Registry
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin ${{ env.DOCKER_REGISTRY }}
   
    - name: Build Docker Image
      run: docker build -t ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }} .
   
    - name: Push Docker Image
      run: docker push ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }}

    - name: Generate SBOM with Syft
      uses: anchore/sbom-action@v0
      with:
        image: ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }}
        format: spdx-json
        output-file: sbom.spdx.json

    - name: Upload SBOM Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sbom
        path: sbom.spdx.json

    - name: Run Trivy Vulnerability Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }}
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy Results to GitHub Security
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Install cosign
      uses: sigstore/cosign-installer@v3

    - name: Clear sigstore cache
      run: rm -rf ~/.sigstore ~/.cache/sigstore

    - name: Sign Docker Image
      env:
        COSIGN_EXPERIMENTAL: 1
        SIGSTORE_NO_CACHE: "true"
      run: |
        cosign sign --yes ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }}

    - name: Push Signed Image to Docker Hub
      run: docker push ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }}
      
    - name: Log out from Docker Registry  
      run: docker logout ${{ env.DOCKER_REGISTRY }}



